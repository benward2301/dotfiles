[main]

capslock = layer(control)
scrolllock = capslock

[control]

m = enter
[ = esc

[meta]

scrollup = C-pageup
scrolldown = C-pagedown
k = up
j = down
h = left
l = right
x = delete
b = pageup
f = pagedown
a = home
e = end

[shift+meta]

k = M-S-k
j = M-S-j
h = M-S-h
l = M-S-l
a = M-S-a
e = M-S-e
