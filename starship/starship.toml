format = '''${custom.worktree_repo}$directory$git_branch$git_status$cmd_duration$env_var
$character'''
add_newline = false

[custom.worktree_repo]
command = 'basename "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"'
when = 'test "$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)" != "$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)"'
format = '[$output]($style):'
style = 'bold cyan'

[directory]
truncation_length = 5
read_only = ''

[git_branch]
symbol = ' '

[git_status]
ahead = '↑'
behind = '↓'
diverged = '↓↑'
deleted = '⨯'

[env_var.AWS_PROFILE]
format = 'with [ $env_value]($style) '
style = 'bold blue'

[cmd_duration]
min_time = 3_000
style = 'bold blue'

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'
